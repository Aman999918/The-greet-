<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء وإدارة العروض</title>
    <style>
        /* إضافة بعض الأنماط الأساسية للمحاكاة */
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; }
        .input-field { border: 1px solid #ccc; padding: 0.5rem; border-radius: 4px; width: 100%; transition: border-color 0.3s; }
        .input-field:focus { border-color: #d90429; outline: none; }
        .input-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        .main-btn { background-color: #d90429; color: white; padding: 0.75rem 1.5rem; border-radius: 6px; transition: background-color 0.3s; }
        .main-btn:hover { background-color: #ef233c; }
        .error { color: #d90429; font-weight: bold; }
        .success { color: #2a9d8f; font-weight: bold; }
        .loading { color: #f77f00; font-weight: bold; }
        
        /* أنماط النافذة المنبثقة (Modal) */
        .modal { transition: opacity 0.3s ease-in-out; }
        .modal-content { max-height: 90vh; overflow-y: auto; }
    </style>
    
</head>
<body class="p-6">

    <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-8">
        إدارة عروض المنتجات (عرض البطاقات) 🛒
    </h2>

    <div class="product-cards-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4" id="productsContainer">
        <p id="loadingMessage" class="col-span-full text-center text-gray-500 text-lg mt-10">
            جاري جلب المنتجات... ⏳
        </p>
    </div>

    <div id="offerModal" class="modal fixed inset-0 bg-gray-600 bg-opacity-75 hidden flex items-center justify-center p-4 z-50">
        <div class="modal-content bg-white rounded-lg shadow-2xl w-full max-w-4xl p-6 relative">
            
            <div class="flex justify-between items-center border-b pb-3 mb-4 sticky top-0 bg-white z-10">
                <h3 class="text-2xl font-bold text-red-700" id="modalTitle">إنشاء عرض جديد</h3>
                <button class="close-modal-btn text-gray-500 hover:text-gray-900 text-3xl leading-none">&times;</button>
            </div>
            
            <form id="offer-form">
                
                <div class="mb-6 p-3 bg-gray-100 rounded-lg border-l-4 border-red-500">
                    <label class="input-label">المنتج المستهدف:</label>
                    <p class="text-lg font-semibold text-red-600" id="selectedProductName">...</p>
                    <input type="hidden" id="selectedProductId" name="productId">
                </div>

                <div class="space-y-4 mb-6">
                    <h4 class="text-xl font-semibold text-gray-700 border-b pb-2">تفاصيل العرض</h4>
                    <div>
                        <label for="offerTitle" class="input-label">عنوان العرض الجذاب</label>
                        <input type="text" id="offerTitle" name="offerTitle" required placeholder="مثال: عرض الصيف الخاص - خصم 50%!" class="input-field p-3 text-base">
                    </div>
                    <div>
                        <label for="offerTagline" class="input-label">شعار أو وصف مختصر للعرض</label>
                        <input type="text" id="offerTagline" name="offerTagline" placeholder="مثال: لا تفوت الفرصة، العرض سارٍ حتى نهاية الشهر." class="input-field p-3 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 border rounded-lg bg-red-50">
                    <div>
                        <label for="unitPrice" class="input-label text-gray-800">السعر الأصلي (ر.س)</label>
                        <input type="number" id="unitPrice" step="0.01" min="0" required class="input-field bg-white" value="0">
                    </div>
                    <div>
                        <label for="discount" class="input-label text-gray-800">الخصم (%)</label>
                        <input type="number" id="discount" min="0" max="100" value="0" class="input-field bg-white">
                    </div>
                    <div class="flex flex-col justify-end p-2 bg-green-100 rounded-lg">
                        <label class="input-label text-green-700">السعر النهائي بعد الخصم</label>
                        <p id="finalPriceDisplay" class="text-3xl font-extrabold text-green-700 mt-1">0.00 ر.س</p>
                        <input type="hidden" id="finalPrice" name="finalPrice">
                    </div>
                </div>

                <h4 class="text-xl font-semibold text-gray-700 border-b pb-2 mt-8 mb-4">
                    أقسام إضافية وشروط (مزايا، شحن، إلخ)
                </h4>
                <div id="dynamicSectionsContainer" class="space-y-4 mb-4 p-3 border rounded-lg bg-gray-50">
                    <p class="text-gray-500 italic text-center">لا توجد أقسام إضافية حتى الآن.</p>
                </div>
                <button type="button" id="addSectionButton" class="text-blue-600 hover:text-blue-800 font-semibold mb-6 flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">add</span>
                    إضافة قسم جديد
                </button>

                <h4 class="text-xl font-semibold text-gray-700 border-b pb-2 mt-8 mb-4">
                    الحجج الإقناعية النهائية (بناء الثقة والدافع)
                </h4>
                <div id="closingArgumentsContainer" class="space-y-4 mb-4 p-3 border rounded-lg bg-red-50">
                    <p class="text-gray-500 italic text-center">أضف النقاط الإقناعية التي تسبق كشف السعر.</p>
                </div>
                <button type="button" id="addClosingArgumentButton" class="text-blue-600 hover:text-blue-800 font-semibold mb-6 flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">add</span>
                    إضافة حجة إقناعية
                </button>

                <div class="mt-8 pt-4 border-t sticky bottom-0 bg-white">
                    <button type="submit" id="saveOfferButton" class="main-btn w-full text-lg">
                        حفظ العرض وتوليد الرابط 🎉
                    </button>
                    <p id="statusMessage" class="text-center mt-3 hidden"></p>
                    
                    <div id="offerLinkDisplay" class="mt-4 p-3 bg-yellow-100 rounded hidden text-center">
                        <p class="font-semibold text-gray-700">تم توليد الرابط بنجاح:</p>
                        <a id="generatedLink" href="#" target="_blank" class="text-blue-600 truncate block text-sm underline mt-1"></a>
                        <button type="button" id="copyLinkButton" class="text-red-600 hover:text-red-800 font-medium mt-1">
                            <span class="material-symbols-outlined align-middle text-sm mr-1">content_copy</span> نسخ الرابط
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
    
    <script type="module" src="OfferCreator.js"></script>
</body>
</html>
